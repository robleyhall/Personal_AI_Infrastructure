# Copilot coding agent environment setup
# This configures the environment when Copilot is assigned to issues or
# mentioned in comments. Equivalent to the claude.yml workflow but uses
# GitHub's native Copilot coding agent instead of claude-code-action.
#
# Activation: Assign @copilot to an issue, or mention @copilot in a comment.
# Docs: https://docs.github.com/copilot/using-github-copilot/using-copilot-coding-agent

setup:
  - name: Install Bun
    run: |
      curl -fsSL https://bun.sh/install | bash
      echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

  - name: Install PAI runtime
    run: |
      ./Copilot/install.sh
      echo "$HOME/.pai/Bin" >> "$GITHUB_PATH"

  - name: Verify setup
    run: |
      echo "PAI_DIR=$HOME/.pai"
      ls ~/.pai/tools/
      bun --version
